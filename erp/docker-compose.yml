services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: "file:/data/erp.db"
      JWT_SECRET: "cambia-este-secreto"
      PORT: "4000"
      CORS_ORIGIN: "http://localhost:8080"
    ports:
      - "4000:4000"
    volumes:
      - erp-data:/data

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: "http://localhost:4000"
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  erp-data:
